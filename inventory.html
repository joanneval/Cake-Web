<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="sign.css">
     <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f4f6fb;
    color:#333;
}



.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:15px 40px;
    background:#7b2cbf;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.logo{
    color:white;
    font-size:28px;
    font-weight:700;
}

.nav-links{
    display:flex;
    gap:15px;
    list-style:none;
}

.nav-links a{
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:8px;
    transition:0.3s;
}

.nav-links a:hover{
    background:rgba(255,255,255,0.15);
}

/* ================= MAIN ================= */

.admin-container{
    padding:100px 30px 30px;
}

.admin-header{
    margin-bottom:25px;
}

.admin-header h1{
    font-size:36px;
    color:#5a189a;
    margin-bottom:8px;
}

.admin-header p{
    color:#777;
}

/* ================= STATS ================= */

.stats-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
    transition:0.3s;
}

.stat-card:hover{
    transform:translateY(-4px);
}

.stat-card h3{
    font-size:15px;
    color:#777;
    margin-bottom:10px;
}

.stat-card .number{
    font-size:32px;
    font-weight:700;
    color:#7b2cbf;
}

/* ================= CONTENT ================= */

.content-wrapper{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:25px;
}

/* ================= FORM ================= */

.add-form-section{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
    height:fit-content;
}

.add-form-section h3{
    margin-bottom:20px;
    color:#5a189a;
    font-size:22px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:500;
    color:#555;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px 14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    transition:0.3s;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#7b2cbf;
    outline:none;
    box-shadow:0 0 0 4px rgba(123,44,191,0.1);
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    border:none;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:#7b2cbf;
    color:white;
}

.btn-success{
    background:#2dc653;
    color:white;
}

.btn-danger{
    background:#ef233c;
    color:white;
}

/* ================= TABLE ================= */

.table-section{
    background:white;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
    overflow:hidden;
}

.table-header{
    padding:20px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

.search-box{
    padding:10px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    width:260px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#7b2cbf;
    color:white;
    padding:15px;
    text-align:left;
    font-size:14px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#faf7ff;
}

/* ================= STATUS ================= */

.status-badge{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.status-in-stock{
    background:#d8f3dc;
    color:#1b4332;
}

.status-low-stock{
    background:#fff3bf;
    color:#99582a;
}

.status-out-of-stock{
    background:#ffd6d6;
    color:#9d0208;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .content-wrapper{
        grid-template-columns:1fr;
    }

}

@media(max-width:768px){

    .navbar{
        padding:15px 20px;
    }

    .admin-container{
        padding:90px 15px 20px;
    }

    .table-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .search-box{
        width:100%;
    }

    th,td{
        padding:12px;
        font-size:14px;
    }
    .low-stock{
    background:#fff8e1;
}

.out-stock{
    background:#ffe5e5;

}
}

</style>
</head>
<body>

    <script>
        let user = JSON.parse(localStorage.getItem("user"));
        if (!user || user.role !== "admin"){
            alert("Admin access only!");
            window.location.href = "homepage.html";
        }
    </script>

    <div class="admin-container">

    <div class="admin-header">
        <h1>Inventory Management</h1>
        <p>Manage your products and monitor stock levels</p>
    </div>

    <!-- STATS -->
    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Products</h3>
            <div class="number" id="totalItems">0</div>
        </div>

        <div class="stat-card">
            <h3>Low Stock</h3>
            <div class="number" id="lowStock">0</div>
        </div>

        <div class="stat-card">
            <h3>Out of Stock</h3>
            <div class="number" id="outStock">0</div>
        </div>
    </div>

    <div class="content-wrapper">

        <!-- FORM -->
        <div class="add-form-section">
            <h3>Add Product</h3>

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="prodName">
            </div>

            <div class="form-group">
                <label>Size</label>
                <select id="prodSize">
                    <option value="Small">Small</option>
                    <option value="Medium">Medium</option>
                    <option value="Large">Large</option>
                </select>
            </div>

            <div class="form-group">
                <label>Flavor</label>
                <input type="text" id="prodFlavor">
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="prodQty">
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="number" id="prodPrice">
            </div>

            <div class="form-actions">
                <button class="btn btn-success" onclick="clearForm()">Clear</button>
                <button class="btn btn-primary" onclick="addInventory()">Save Product</button>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-section">

            <div class="table-header">
                <h3>Inventory List</h3>

                <input type="text"
                       class="search-box"
                       placeholder="Search products..."
                       id="searchInput">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Size</th>
                            <th>Flavor</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Updated</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
    loadInventory();

    let editingId = null;

    function loadInventory() {
        fetch("inventory.php")
        .then(res => res.json())
        .then(data => {
            let table = document.getElementById("inventoryTable");
            table.innerHTML = "";
            data.forEach(item => {
                let row = table.insertRow();
                let statusClass =
                item.quantity === 0
                ? 'out-stock'
                : item.quantity <= 5
                ? 'low-stock'
                : '';
                let statusText = item.quantity > 5 ? 'In Stock' : item.quantity > 0 ? 'Low Stock' : 'Out of Stock';
                row.className = statusClass;
                
                row.innerHTML = `
                    <td>${item.product_name}</td>
                    <td>${item.size}</td>
                    <td>${item.flavor}</td>
                    <td><strong>${item.quantity}</strong></td>
                    <td>₱${parseFloat(item.price).toFixed(2)}</td>
                    <td><span class="status-badge status-${statusText.toLowerCase().replace(' ', '-')}">${statusText}</span></td>
                    <td>${new Date(item.last_updated).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-primary" onclick="editInventory('${item._id}', '${item.product_name}', '${item.size}', '${item.flavor}', ${item.quantity}, ${item.price})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteInventory('${item._id}')" title="Delete Item">Delete</button>
                        </td>
                `;
            });
            updateStats(data);
        })
        .catch(err => console.error("Load error:", err));  
    }

    function editInventory(id, name, size, flavor, qty, price) {
    
        document.getElementById("prodName").value = name;
        document.getElementById("prodSize").value = size;
        document.getElementById("prodFlavor").value = flavor;
        document.getElementById("prodQty").value = qty;
        document.getElementById("prodPrice").value = price;

        editingId = id;
        document.querySelector('.form-actions .btn:not(.btn-success)').textContent = 'Update Item';
        document.querySelector('.form-actions .btn:not(.btn-success)').style.background = 'linear-gradient(45deg, #28a745, #20c997)';
        
       document.querySelector('.add-form-section').scrollIntoView({ behavior: 'smooth' });
            
        }
       
    function addInventory() {
        let formData = new FormData();
        formData.append("product_name", document.getElementById("prodName").value);
        formData.append("size", document.getElementById("prodSize").value);
        formData.append("flavor", document.getElementById("prodFlavor").value);
        formData.append("quantity", document.getElementById("prodQty").value);
        formData.append("price", document.getElementById("prodPrice").value);

        if(editingId){
            formData.append("edit_id", editingId);
        }

        fetch("inventory.php", { method: "POST", body: formData })
        .then(res => res.text())
        .then(data => {
            if (data.trim() === "success") {
                let message = editingId ? "Item updated successfully!" : "Item added successfully!";
                alert(message);
                loadInventory();
                clearForm();
                editingId = null;
            } else {
                alert(" Error: " + data);
            }
        })
        .catch(err => console.error("Add error:", err));
    }

    function deleteInventory(id) {
        if (confirm(" Delete this inventory item?")) {
            let formData = new FormData();
            formData.append("delete_id", id);
            fetch("inventory.php", { method: "POST", body: formData })
            .then(res => res.text())
            .then(data => {
                if (data.trim() === "deleted") {
                    alert(" Item deleted successfully!");
                    loadInventory();
                } else {
                    alert(" Error: " + data.trim());
                }
            })
            .catch(err => {
                console.error("Delete error:", err);
                alert(" Delete failed: " + err.message);
            });
        }
    }

    function clearForm() {
        document.getElementById("prodName").value = "";
        document.getElementById("prodSize").value = "Small";
        document.getElementById("prodFlavor").value = "";
        document.getElementById("prodQty").value = "";
        document.getElementById("prodPrice").value = "";

        let saveBtn = document.querySelector('.form-actions .btn:not(.btn-success)');
        saveBtn.textContent = 'Add/Update Item';
        saveBtn.style.background = 'linear-gradient(45deg, #9b4dca, #6a1b9a)';
        editingId = null;
    }

  function updateStats(data) {

    let totalItems = data.length;

    let lowStock = data.filter(item =>
        item.quantity > 0 && item.quantity <= 5
    ).length;

    let outOfStock = data.filter(item =>
        item.quantity == 0
    ).length;

    document.getElementById("totalItems").textContent = totalItems;
    document.getElementById("lowStock").textContent = lowStock;
    document.getElementById("outStock").textContent = outOfStock;
}
    document.getElementById("searchInput").addEventListener("keyup", function() {

    let value = this.value.toLowerCase();

    let rows = document.querySelectorAll("#inventoryTable tr");

    rows.forEach(row => {

        row.style.display =
            row.textContent.toLowerCase().includes(value)
            ? ""
            : "none";

    });
});
    </script>
</body>
</html>
